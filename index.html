<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="スマホの使い方や希望に合わせて、格安SIM選びのポイントをわかりやすく比較・診断します。">
<meta name="theme-color" content="#06b6d4">
<title>スマホ代見直しガイド｜ぴったりSIM診断</title>
<style>
:root{--navy:#12314b;--cyan:#14c8e5;--pink:#ff3d91;--yellow:#fff04b;--green:#23c878;--blue:#168fe8;--purple:#8063e8;--ink:#18334b;--muted:#5b7082;--paper:#fff;--pale:#effaff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
a{color:inherit}
button,input{font:inherit}
.topbar{position:sticky;top:0;z-index:10;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid #e6f0f6}
.nav{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:900;color:var(--navy);font-size:clamp(16px,2.3vw,22px);line-height:1.2}
.brand-icon{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--cyan),#73e6a4);display:grid;place-items:center;font-size:23px;box-shadow:0 4px 0 #c3f4f7}
.brand small{display:block;font-size:10px;font-weight:700;margin-top:4px}
.navlinks{display:flex;align-items:center;gap:16px;font-size:12px;font-weight:800}
.navlinks a{text-decoration:none}
.navcta,.btn{border:0;border-radius:999px;background:var(--pink);color:white;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;box-shadow:0 5px 0 #d51c70;cursor:pointer}
.navcta{white-space:nowrap;font-size:12px}
.hero{overflow:hidden;background:linear-gradient(120deg,#03a8df 0%,#23d4ed 52%,#8cebd9 100%);color:white;position:relative}
.hero:after{content:"";position:absolute;right:-70px;bottom:-170px;width:440px;height:440px;border-radius:50%;background:#fff5;pointer-events:none}
.hero-inner{max-width:1120px;margin:auto;padding:48px 24px 38px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:22px;position:relative;z-index:1}
.kicker{display:inline-block;background:var(--yellow);color:var(--navy);padding:5px 13px;border-radius:7px;transform:rotate(-2deg);font-weight:1000}
.hero h1{font-size:clamp(34px,5vw,62px);line-height:1.18;margin:18px 0 14px;font-weight:1000;letter-spacing:-.04em;text-shadow:0 3px 0 #087eae}
.hero h1 em{font-style:normal;color:#ffec55}
.hero p{font-size:clamp(15px,2vw,19px);font-weight:750;max-width:540px}
.hero-art{min-height:300px;display:grid;place-items:center;position:relative}
.phone{width:min(260px,70%);height:340px;border:10px solid #fff;border-radius:38px;background:linear-gradient(160deg,#fff 0 47%,#fff6b7 47%);box-shadow:0 18px 0 #087eae55,0 24px 40px #075b7b44;transform:rotate(7deg);position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--navy);padding:20px;text-align:center}
.phone:before{content:"";position:absolute;top:7px;width:70px;height:12px;border-radius:99px;background:#18334b}
.phone .phone-emoji{font-size:76px;line-height:1.2}
.phone strong{font-size:26px;line-height:1.25}
.phone .bubble{background:var(--pink);color:white;border-radius:18px;padding:9px 15px;font-weight:900;margin-top:14px;transform:rotate(-4deg)}
.spark{position:absolute;font-size:38px;color:var(--yellow);font-weight:1000}
.spark.s1{top:15px;left:10%}.spark.s2{bottom:24px;right:10%;color:#ff529e}.spark.s3{top:28%;right:4%;font-size:24px}
.trustrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.trustrow span{background:#ffffff24;border:1px solid #ffffff77;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:850}
.wrap{max-width:1120px;margin:auto;padding:44px 20px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.section-head h2{font-size:clamp(24px,3.2vw,36px);line-height:1.25;margin:0;font-weight:1000;letter-spacing:-.03em}
.section-head p{margin:8px 0 0;color:var(--muted);font-size:14px}
.marker{background:linear-gradient(transparent 58%,var(--yellow) 58%);padding:0 3px}
.problems{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.problem-card{background:#effaff;border-radius:25px;padding:24px;border:2px solid #d6f4fa}
.problem-card h3{margin:0 0 12px;font-size:22px}
.problem-list{list-style:none;padding:0;margin:0}
.problem-list li{padding:7px 0;font-weight:750}
.problem-list li:before{content:"✓";display:inline-grid;place-items:center;background:#ffd4e7;color:#e91e78;width:25px;height:25px;border-radius:50%;margin-right:9px;font-weight:1000}
.callout{background:var(--yellow);border-radius:28px;padding:28px;text-align:center;transform:rotate(1deg);font-size:clamp(22px,3vw,31px);font-weight:1000;line-height:1.35}
.callout span{color:var(--pink)}
.sim-section{background:linear-gradient(180deg,#effbff,#fff)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.sim-card{background:white;border:2px solid var(--line);border-radius:20px;padding:20px 16px;box-shadow:0 7px 0 #18334b08;display:flex;flex-direction:column}
.sim-card .logo{font-size:clamp(19px,2.3vw,26px);font-weight:1000;letter-spacing:-.04em;color:var(--accent);line-height:1.2}
.sim-card .tag{font-size:11px;color:var(--muted);font-weight:750;min-height:35px;margin-top:8px}
.price{background:var(--tint);padding:12px 8px;border-radius:12px;margin:10px 0;text-align:center;font-weight:900}
.price strong{font-size:25px;display:block;line-height:1.25}
.price small{font-size:11px}
.sim-card ul{padding-left:18px;margin:5px 0 18px;font-size:13px;font-weight:700;flex:1}
.sim-card li{margin:5px 0}
.sim-card .btn{background:var(--accent);box-shadow:0 4px 0 color-mix(in srgb,var(--accent),#000 17%);padding:11px 10px;font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:14px}
.quizbox{display:grid;grid-template-columns:1fr .8fr;gap:24px;align-items:center;background:linear-gradient(120deg,#fffde1,#f3ffea);border:2px solid #f0eb53;border-radius:28px;padding:clamp(20px,4vw,36px)}
.quizbox h2{font-size:clamp(25px,3vw,36px);line-height:1.3;margin:0 0 10px}
.quizbox p{margin:0 0 20px}
.quiz-illustration{font-size:96px;text-align:center}
.quizform{background:white;border:1px solid #e8e8c4;border-radius:20px;padding:22px;margin-top:18px}
.qstep{display:none}.qstep.active{display:block}
.qstep h3{margin:0 0 14px;font-size:18px}
.options{display:grid;gap:10px}
.option{display:flex;align-items:center;gap:10px;padding:12px;border:2px solid #e6edf3;border-radius:13px;cursor:pointer;font-weight:750}
.option:has(input:checked){border-color:var(--pink);background:#fff1f7}
.option input{accent-color:var(--pink);width:18px;height:18px}
.quiz-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.btn.secondary{background:#eaf5fb;color:var(--navy);box-shadow:0 4px 0 #c8e1ed}
.result{display:none;margin-top:18px;padding:18px;background:#f0fbff;border:2px dashed var(--cyan);border-radius:16px}
.result.show{display:block}.result h3{margin-top:0}
.ranklist{border-radius:22px;border:1px solid #f2e9a2;padding:22px;background:#fffef5}
.rankrow{display:flex;align-items:center;gap:13px;padding:14px 0;border-bottom:1px solid #e9edf0}
.rankrow:last-child{border-bottom:0}
.medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);font-size:20px;font-weight:1000;flex-shrink:0}
.rankrow strong{display:block}.rankrow small{color:var(--muted)}
.rankrow a{margin-left:auto;background:var(--pink);color:white;text-decoration:none;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:900;white-space:nowrap}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:12px}
details{background:white;border:1px solid #e1edf2;border-radius:15px;padding:16px}
summary{cursor:pointer;font-weight:900}
details p{font-size:14px;color:var(--muted);margin-bottom:0}
.disclosure{background:#f6f7fa;border-radius:14px;padding:16px;font-size:12px;color:#5b6c7b}
.footer-hero{background:linear-gradient(100deg,#134a86,#08a9d6);color:white;padding:30px 20px;text-align:center}
.footer-hero h2{font-size:clamp(24px,4vw,38px);margin:0 0 8px}
footer{padding:24px 16px;text-align:center;font-size:12px;color:#607384}
footer a{margin:0 8px}
@media(max-width:800px){.nav{padding:10px 12px}.navlinks{display:none}.hero-inner{grid-template-columns:1fr;padding:38px 20px 28px;gap:0}.hero-art{min-height:240px}.phone{height:270px;width:200px}.hero h1{font-size:42px}.cards{grid-template-columns:repeat(2,1fr)}.problems,.quizbox{grid-template-columns:1fr}.callout{max-width:520px;margin:auto}.quiz-illustration{display:none}.section-head{align-items:start;flex-direction:column}.faq{grid-template-columns:1fr}}
@media(max-width:420px){.brand{font-size:15px}.brand-icon{width:34px;height:34px}.navcta{padding:10px 12px;font-size:11px}.hero h1{font-size:36px}.wrap{padding:32px 14px}.cards{gap:10px}.sim-card{padding:15px 12px}.sim-card .logo{font-size:20px}.price strong{font-size:22px}.sim-card ul{font-size:12px;padding-left:16px}.quizbox{padding:18px}.quizform{padding:15px}}
</style>
</head>
